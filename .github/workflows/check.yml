name: Code and UI checks

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check code and UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Check and build frontend
        run: bun run check
      - name: Check firmware configuration and scripts
        run: |
          python3 -m unittest discover -s tests/firmware -v
          python3 -m compileall -q scripts tests/runtime
          for script in scripts/*.sh files/router-defaults.sh package/router-ui/files/router.maintenance package/router-ui/files/router.status package/router-ui/files/router.diagnostics package/router-ui/files/led-state package/router-ui/files/router-ui-led package/router-ui/files/router-ui-led-boot package/router-ui/files/led-hotplug package/router-ui/files/led-defaults package/router-ui/files/scheduled-reboot package/router-ui/files/schedule-defaults; do bash -n "$script"; done
      - name: Validate browser test definitions
        run: bunx playwright test --list
