name: Simulate OpenWrt installation

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: Build installable UI package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install SDK prerequisites
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 build-essential clang flex bison gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip \
            zlib1g-dev file wget curl zstd
      - name: Restore verified SDK download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/simulation-downloads
          key: simulation-sdk-${{ hashFiles('configs/simulation.json') }}
      - name: Build static frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Build real OpenWrt package with SDK
        run: bash scripts/build-simulation-package.sh
      - name: Upload package and build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: simulation-package
          path: build/simulation-package/
          retention-days: 14
          if-no-files-found: warn

  runtime:
    name: Test ${{ matrix.device }} ${{ matrix.role }}
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: jdcloud-ax1800
            role: router
          - device: phicomm-n1
            role: bypass
          - device: phicomm-n1
            role: router
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Download installable UI package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: simulation-package
          path: build/simulation-package
      - name: Install emulator and network test tools
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 build-essential gawk libncurses-dev libssl-dev \
            zlib1g-dev python3 rsync unzip file wget curl zstd gettext xsltproc \
            uuid-runtime qemu-system-arm iproute2 iptables busybox-static openssh-client openssl
          busybox --list | grep -qx udhcpc
      - name: Restore verified ImageBuilder download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/simulation-downloads
          key: simulation-imagebuilder-${{ hashFiles('configs/simulation.json') }}
      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
      - name: Install browser test dependencies
        timeout-minutes: 15
        run: |
          bun install --frozen-lockfile
          bun run build
          bunx playwright install --with-deps --only-shell chromium
      - name: Boot OpenWrt and test installed package
        env:
          DEVICE: ${{ matrix.device }}
          ROLE: ${{ matrix.role }}
        run: bash scripts/simulate.sh "$DEVICE" "$ROLE" build/simulation-package/router-ui.apk
      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: simulation-${{ matrix.device }}-${{ matrix.role }}
          path: build/simulation-report/
          retention-days: 14
          if-no-files-found: warn
      - name: Write test summary
        if: always()
        env:
          DEVICE: ${{ matrix.device }}
          ROLE: ${{ matrix.role }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "### OpenWrt simulation: $DEVICE / $ROLE"
            echo "Result: $RESULT"
            echo 'ARM64 QEMU guest, real APK installation, reboot, RPC, DHCP, NAT and browser tests.'
            echo "Reports: simulation-$DEVICE-$ROLE artifact. Physical hardware drivers are outside this test."
          } >> "$GITHUB_STEP_SUMMARY"
