name: Clean old Code and UI check runs

on:
  workflow_run:
    workflows:
      - Code and UI checks
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Clean old Code and UI check runs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete old Code and UI check runs
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 2
          keep_minimum_runs: 0
          delete_workflow_pattern: check.yml
