name: Build lightweight firmware

on:
  workflow_dispatch:
    inputs:
      device:
        description: 构建设备
        type: choice
        default: both
        options:
          - both
          - jdcloud-ax1800
          - phicomm-n1
      n1_role:
        description: N1 模式（主路由默认 USB WAN，可在页面切换无线方案）
        type: choice
        default: both
        options:
          - both
          - bypass
          - router
      n1_wan:
        description: N1 主路由默认 USB WAN 网口名称
        type: string
        default: eth1
      publish:
        description: 同时创建独立版本的 Release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}-${{ inputs.device }}-${{ inputs.n1_role }}
  cancel-in-progress: false

jobs:
  plan:
    name: Prepare build matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - name: Select target devices
        id: select
        env:
          DEVICE: ${{ inputs.device }}
          N1_ROLE: ${{ inputs.n1_role }}
        run: |
          python3 - <<'PY'
          import json
          import os

          device = os.environ["DEVICE"]
          role = os.environ["N1_ROLE"]
          if device not in ("both", "jdcloud-ax1800", "phicomm-n1"):
              raise SystemExit("设备参数无效")
          if role not in ("both", "bypass", "router"):
              raise SystemExit("运行模式无效")
          targets = []
          if device != "phicomm-n1":
              targets.append({"device": "jdcloud-ax1800", "role": "router"})
          if device != "jdcloud-ax1800":
              roles = ("bypass", "router") if role == "both" else (role,)
              targets.extend({"device": "phicomm-n1", "role": selected} for selected in roles)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("targets=" + json.dumps({"include": targets}, separators=(",", ":")) + "\n")
          PY

  build:
    name: Build ${{ matrix.device }} ${{ matrix.role }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      TZ: Asia/Shanghai
      DEVICE: ${{ matrix.device }}
      ROLE: ${{ matrix.role }}
      N1_WAN: ${{ inputs.n1_wan }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Prepare build environment
        timeout-minutes: 30
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync \
            swig unzip zlib1g-dev file wget curl time jq subversion \
            btrfs-progs dosfstools e2fsprogs uuid-runtime kpartx parted pigz \
            zstd xz-utils u-boot-tools qemu-utils libfuse-dev libelf-dev \
            device-tree-compiler fdisk bc gperf help2man autoconf automake libtool
          df -h .
      - name: Build frontend package
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Restore download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/downloads
          key: downloads-v2-${{ matrix.device }}-${{ hashFiles('configs/sources.json', 'configs/*.config') }}
          restore-keys: |
            downloads-v2-${{ matrix.device }}-
            downloads-${{ matrix.device }}-${{ hashFiles('configs/sources.json') }}
            downloads-${{ matrix.device }}-
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/ccache
          key: compiler-v1-${{ runner.os }}-${{ matrix.device }}-${{ matrix.role }}-${{ hashFiles('configs/sources.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compiler-v1-${{ runner.os }}-${{ matrix.device }}-${{ matrix.role }}-${{ hashFiles('configs/sources.json') }}-
            compiler-v1-${{ runner.os }}-${{ matrix.device }}-${{ matrix.role }}-
      - name: Compile firmware and frontend package
        run: |
          bash scripts/build-firmware.sh "$DEVICE" "$ROLE" "$N1_WAN"
      - name: Package N1 boot image
        if: matrix.device == 'phicomm-n1'
        run: |
          shopt -s nullglob
          rootfs=(build/artifacts/*rootfs.tar.gz)
          (( ${#rootfs[@]} == 1 )) || exit 1
          bash scripts/package-n1.sh "${rootfs[0]}"
      - name: Generate artifact checksums
        run: bash scripts/checksum.sh build/artifacts
      - name: Save compiler cache
        if: always() && !cancelled() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.device }}-${{ matrix.role }}-${{ github.run_number }}
          path: |
            build/artifacts/
            build/openwrt/.config
            build/openwrt/logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve N1 rootfs and package after failure
        if: failure() && matrix.device == 'phicomm-n1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: n1-${{ matrix.role }}-build-recovery-${{ github.run_number }}
          path: |
            build/openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
            build/openwrt/bin/targets/armsr/armv8/*.manifest
            build/openwrt/bin/packages/**/router-ui-*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Publish versioned release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$DEVICE-$ROLE-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          DEVICE_NAME='京东云 AX1800'
          IMAGE_NOTE='已刷 OpenWrt 的设备使用 sysupgrade.bin；factory.bin 供原厂刷入或救砖使用。'
          if [[ "$DEVICE" == phicomm-n1 ]]; then
            DEVICE_NAME='斐讯 N1'
            IMAGE_NOTE='将对应模式的 .img.gz 写入新 U 盘；rootfs.tar.gz 仅用于再次打包。'
          fi
          ROLE_NAME='主路由'
          if [[ "$ROLE" == bypass ]]; then ROLE_NAME='旁路由'; fi
          VERSION=$(jq -r .version package.json)
          cat > build/release-notes.md <<EOF
          设备：$DEVICE_NAME
          运行模式：$ROLE_NAME
          控制台版本：$VERSION
          项目提交：$GITHUB_SHA
          构建记录：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          $IMAGE_NOTE
          下载后按 sha256sums 核对镜像与安装包摘要。
          源码、feeds 与 N1 内核版本见 build-inputs.json。
          本次直接构建与发布镜像，未执行模拟机安装测试，功能验收以实机为准。
          刷机步骤：https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/flashing.md
          EOF
          gh release create "$TAG" build/artifacts/* --title "$DEVICE_NAME $ROLE_NAME · $VERSION · $GITHUB_RUN_NUMBER" \
            --target "$GITHUB_SHA" --notes-file build/release-notes.md
