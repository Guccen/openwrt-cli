name: Build lightweight firmware

on:
  workflow_dispatch:
    inputs:
      device:
        description: 构建设备
        type: choice
        default: both
        options:
          - both
          - jdcloud-ax1800
          - phicomm-n1
      n1_role:
        description: N1 模式（主路由需要额外 USB 有线网卡）
        type: choice
        default: bypass
        options:
          - bypass
          - router
      n1_wan:
        description: N1 主路由的 WAN 网口名称
        type: string
        default: eth1
      publish:
        description: 同时创建独立版本的 Release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}-${{ inputs.device }}-${{ inputs.n1_role }}
  cancel-in-progress: false

jobs:
  check:
    name: Run checks
    uses: ./.github/workflows/check.yml

  simulate:
    name: Verify simulated installation
    uses: ./.github/workflows/simulate.yml

  plan:
    name: Prepare build matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      devices: ${{ steps.select.outputs.devices }}
    steps:
      - name: Select target devices
        id: select
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          case "$DEVICE" in
            both) devices='["jdcloud-ax1800","phicomm-n1"]' ;;
            jdcloud-ax1800|phicomm-n1) devices="[\"$DEVICE\"]" ;;
            *) echo '设备参数无效'; exit 1 ;;
          esac
          echo "devices=$devices" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.device }}
    needs: [check, plan, simulate]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.plan.outputs.devices) }}
    env:
      TZ: Asia/Shanghai
      DEVICE: ${{ matrix.device }}
      N1_ROLE: ${{ inputs.n1_role }}
      N1_WAN: ${{ inputs.n1_wan }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Prepare build environment
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync \
            swig unzip zlib1g-dev file wget curl time jq subversion \
            btrfs-progs dosfstools e2fsprogs uuid-runtime kpartx parted pigz \
            zstd xz-utils u-boot-tools qemu-utils libfuse-dev libelf-dev \
            device-tree-compiler fdisk bc gperf help2man autoconf automake libtool \
            qemu-system-arm iproute2 iptables busybox-static openssh-client openssl
          df -h .
      - name: Build frontend package
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Restore download cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/downloads
          key: downloads-${{ matrix.device }}-${{ hashFiles('configs/sources.json') }}
          restore-keys: downloads-${{ matrix.device }}-
      - name: Compile firmware and frontend package
        run: |
          ROLE=router
          if [[ "$DEVICE" == phicomm-n1 ]]; then ROLE="$N1_ROLE"; fi
          bash scripts/build-firmware.sh "$DEVICE" "$ROLE" "$N1_WAN"
      - name: Test compiled package in OpenWrt
        run: |
          bunx playwright install --with-deps --only-shell chromium
          shopt -s nullglob
          packages=(build/artifacts/router-ui*.apk)
          (( ${#packages[@]} == 1 )) || { echo 'Expected exactly one router-ui APK'; exit 1; }
          ROLE=router
          if [[ "$DEVICE" == phicomm-n1 ]]; then ROLE="$N1_ROLE"; fi
          bash scripts/simulate.sh "$DEVICE" "$ROLE" "${packages[0]}"
      - name: Package N1 boot image
        if: matrix.device == 'phicomm-n1'
        run: |
          shopt -s nullglob
          rootfs=(build/artifacts/*rootfs.tar.gz)
          (( ${#rootfs[@]} == 1 )) || exit 1
          bash scripts/package-n1.sh "${rootfs[0]}"
      - name: Generate artifact checksums
        run: bash scripts/checksum.sh build/artifacts
      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.device }}-${{ matrix.device == 'phicomm-n1' && inputs.n1_role || 'router' }}-${{ github.run_number }}
          path: |
            build/artifacts/
            build/openwrt/.config
            build/openwrt/logs/
            build/simulation-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve N1 rootfs and package after failure
        if: failure() && matrix.device == 'phicomm-n1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: n1-build-recovery-${{ github.run_number }}
          path: |
            build/openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
            build/openwrt/bin/targets/armsr/armv8/*.manifest
            build/openwrt/bin/packages/**/router-ui-*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Publish versioned release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ROLE=router
          if [[ "$DEVICE" == phicomm-n1 ]]; then ROLE="$N1_ROLE"; fi
          TAG="$DEVICE-$ROLE-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cat > build/release-notes.md <<EOF
          设备：$DEVICE
          运行模式：$ROLE
          项目提交：$GITHUB_SHA
          源码、feeds 与 N1 内核版本见 build-inputs.json。
          首次使用和接线方式见项目 README。
          EOF
          gh release create "$TAG" build/artifacts/* --title "$TAG" \
            --target "$GITHUB_SHA" --notes-file build/release-notes.md
